name: release

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          ## FreeBSD release assets

          - `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated_notes_file"

          # 若自动生成的 release notes 过长，先做一次宽松截断（保险）
          gen_max=100000
          if [[ -s "$generated_notes_file" && $(wc -c <"$generated_notes_file") -gt $gen_max ]]; then
            echo "Generated notes too long ($(wc -c <\"$generated_notes_file\") bytes), truncating to ${gen_max} bytes" >&2
            head -c "$gen_max" "$generated_notes_file" > "${generated_notes_file}.trunc"
            mv "${generated_notes_file}.trunc" "$generated_notes_file"
          fi

          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          # 最终截断保护，确保最终 release body 不超过 max_bytes（严格）
          max_bytes=1200
          if [[ -n "$previous_tag" ]]; then
            suffix="$(printf '\n\n**(truncated)** Full changelog: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME")"
          else
            suffix="$(printf '\n\n**(truncated)** Full changelog: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME")"
          fi
          suffix_bytes=$(printf "%s" "$suffix" | wc -c)
          current_bytes=$(wc -c <"$updated_notes_file")
          if [[ $current_bytes -gt $max_bytes ]]; then
            if [[ $suffix_bytes -ge $max_bytes ]]; then
              suffix=$'\n\n**(truncated)**\n'
              suffix_bytes=$(printf "%s" "$suffix" | wc -c)
            fi
            keep_bytes=$((max_bytes - suffix_bytes))
            if [[ $keep_bytes -le 0 ]]; then
              printf "%s" "$suffix" > "${updated_notes_file}.trunc"
            else
              head -c "$keep_bytes" "$updated_notes_file" > "${updated_notes_file}.trunc"
              printf "%s" "$suffix" >> "${updated_notes_file}.trunc"
            fi
            mv "${updated_notes_file}.trunc" "$updated_notes_file"
            echo "Truncated updated release notes to ${max_bytes} bytes" >&2
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          fi

  # Commented out: build-hosted (macOS / Windows) per request to keep only Linux builds
  # build-hosted:
  #   (omitted - commented)

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - target: linux-armv7
            runner: ubuntu-latest
            goarch: arm
            asset_arch: armv7
            manylinux_image: ''    # empty -> use Debian Stretch arm container build (arm32v7/debian:stretch)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags

      # Setup QEMU only when building armv7 via container emulation
      - name: Setup QEMU emulation
        if: matrix.goarch == 'arm'
        uses: docker/setup-qemu-action@v2

      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          if [[ -n "${MANYLINUX_IMAGE}" ]]; then
            # manylinux docker 构建（unchanged）
            docker run --rm \
              -v "$PWD:/src" \
              -w /src \
              -e GO_VERSION \
              -e GOARCH \
              -e RELEASE_VERSION \
              -e COMMIT \
              -e BUILD_DATE \
              "$MANYLINUX_IMAGE" \
              bash -euo pipefail -c '
                go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
                curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
                rm -rf /usr/local/go
                tar -C /usr/local -xzf "/tmp/${go_archive}"
                export PATH="/usr/local/go/bin:${PATH}"

                CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                  -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                  -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

                glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
                if [[ -n "${glibc_versions}" ]]; then
                  printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                  max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                  if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                    printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                    exit 1
                  fi
                fi
              '
          else
            # Build inside an official Debian Stretch armv7 container (emulated via QEMU).
            # This ensures the produced binary links against glibc 2.24 (Debian 9 / stretch).
            echo "Building for ${GOARCH} using arm32v7/debian:stretch (via --platform=linux/arm/v7)"

            docker run --rm --platform=linux/arm/v7 \
              -v "$PWD:/src" -w /src \
              -e GO_VERSION -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
              arm32v7/debian:stretch \
              bash -euo pipefail -c '
                set -eux
                apt-get update
                apt-get install -y --no-install-recommends gcc build-essential curl ca-certificates binutils
                # Try Go tarballs for 32-bit ARM
                candidates=( "go${GO_VERSION}.linux-arm.tar.gz" "go${GO_VERSION}.linux-armv6l.tar.gz" )
                found=0
                for go_archive in "${candidates[@]}"; do
                  echo "Trying download: ${go_archive}"
                  if curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"; then
                    found=1
                    break
                  fi
                done
                if [[ $found -ne 1 ]]; then
                  echo "Failed to download Go tarball for ARM" >&2
                  exit 1
                fi
                rm -rf /usr/local/go
                tar -C /usr/local -xzf "/tmp/${go_archive}"
                export PATH="/usr/local/go/bin:${PATH}"

                # Build with CGO enabled targeting armv7
                CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
                  go build -buildvcs=false \
                    -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                    -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

                # Print GLIBC symbols required by the built binary (for verification)
                if command -v readelf >/dev/null 2>&1; then
                  readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\\([0-9.]*\\).*/GLIBC_\\1/p" | sort -Vu || true
                fi
              '
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  # Commented out: build-linux-no-plugin (omitted)

  # Commented out: build-freebsd (omitted)

  publish-checksums:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-linux-glibc
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber
