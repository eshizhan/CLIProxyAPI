# .github/workflows/release.yaml
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          ## FreeBSD release assets

          - `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF

          git fetch --force --tags || true
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" | grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > "$generated_notes_file" || true

          gen_max=100000
          if [[ -s "$generated_notes_file" && $(wc -c <"$generated_notes_file") -gt $gen_max ]]; then
            head -c "$gen_max" "$generated_notes_file" > "${generated_notes_file}.trunc"
            mv "${generated_notes_file}.trunc" "$generated_notes_file"
          fi

          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          # Safe truncation to avoid GitHub 422
          max_bytes=1200
          if [[ -n "$previous_tag" ]]; then
            suffix="$(printf '\n\n**(truncated)** Full changelog: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME")"
          else
            suffix="$(printf '\n\n**(truncated)** Full changelog: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME")"
          fi
          suffix_bytes=$(printf "%s" "$suffix" | wc -c)
          current_bytes=$(wc -c <"$updated_notes_file")
          if [[ $current_bytes -gt $max_bytes ]]; then
            if [[ $suffix_bytes -ge $max_bytes ]]; then
              suffix=$'\n\n**(truncated)**\n'
              suffix_bytes=$(printf "%s" "$suffix" | wc -c)
            fi
            keep_bytes=$((max_bytes - suffix_bytes))
            if [[ $keep_bytes -le 0 ]]; then
              printf "%s" "$suffix" > "${updated_notes_file}.trunc"
            else
              head -c "$keep_bytes" "$updated_notes_file" > "${updated_notes_file}.trunc"
              printf "%s" "$suffix" >> "${updated_notes_file}.trunc"
            fi
            mv "${updated_notes_file}.trunc" "$updated_notes_file"
            echo "Truncated updated release notes to ${max_bytes} bytes" >&2
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file" || true
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file" || true
          fi

################################################################################
# manylinux builds (amd64 + arm64 on arm runner to avoid emulation issues)
################################################################################
  build-linux-glibc:
    name: build linux (manylinux)
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        run: git fetch --force --tags
      - name: Metadata
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build manylinux
        env:
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          GOARCH="${{ matrix.goarch }}"
          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${TARGET}_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          DOCKER_PLATFORM="linux/${GOARCH}"
          docker run --rm --platform="${DOCKER_PLATFORM}" \
            -v "$PWD:/src" -w /src \
            -e GO_VERSION -e GOARCH -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
            "${MANYLINUX_IMAGE}" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"
              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/
            '
          if [[ -f "$archive_dir/cli-proxy-api" ]] && command -v readelf >/dev/null 2>&1; then
            readelf --version-info "$archive_dir/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\\([0-9.]*\\).*/GLIBC_\\1/p" | sort -Vu > "$archive_dir/build-readelf.txt" || true
          fi
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/" || true
          tar -C "$archive_dir" -czf "dist/$archive_name" -C "$archive_dir" . || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*_${{ matrix.target }}*.tar.gz)
          if [[ ${#assets[@]} -gt 0 ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber || true

################################################################################
# Parallel armv7 attempts (on ubuntu-latest) - emulate, crosspkg, debootstrap-emulated, static
################################################################################
  build-armv7-parallel:
    name: build armv7 (parallel on ubuntu-latest)
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method:
          - qemu-docker
          - debootstrap-chroot-qemu
          - crosspkg-sysroot
          - static-fallback
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup QEMU (needed for qemu and debootstrap-chroot-qemu)
        if: contains(matrix.method, 'qemu') 
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm/v7

      - name: Setup buildx (needed for qemu)
        if: contains(matrix.method, 'qemu')
        uses: docker/setup-buildx-action@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Metadata
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build (method = ${{ matrix.method }})
        shell: bash
        env:
          METHOD: ${{ matrix.method }}
        run: |
          set -euo pipefail
          TARGET=linux-armv7
          ASSET_ARCH=armv7
          archive_dir="dist/${TARGET}/${METHOD}/archive"
          outname="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_${METHOD}.tar.gz"
          rm -rf "dist/${TARGET}/${METHOD}"
          mkdir -p "$archive_dir"

          check_glibc_and_write() {
            bin="$1"
            out="$2"
            if command -v readelf >/dev/null 2>&1; then
              max_glibc=$(readelf --version-info "$bin" 2>/dev/null | sed -n "s/.*Name: GLIBC_\\([0-9.]*\\).*/\\1/p" | sort -Vu | tail -n1 || true)
              echo "max_glibc=${max_glibc}" > "$out"
            else
              echo "readelf: not available" > "$out"
            fi
          }

          case "${METHOD}" in
            qemu-docker)
              echo "qemu-docker: run arm32v7/debian:stretch with archive.debian.org"
              docker run --rm --platform=linux/arm/v7 \
                -v "$PWD:/src" -w /src \
                -e RELEASE_VERSION -e COMMIT -e BUILD_DATE \
                arm32v7/debian:stretch \
                bash -eux -c '
                  # Use archive for stretch
                  echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
                  printf "%s\n" "deb http://archive.debian.org/debian stretch main" "deb http://archive.debian.org/debian-security stretch/updates main" > /etc/apt/sources.list
                  apt-get -o Acquire::Check-Valid-Until=false update
                  apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends build-essential ca-certificates curl golang-go
                  export GOPATH=/go
                  export PATH=/usr/local/go/bin:/usr/bin:$PATH || true
                  CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
                    go build -buildvcs=false -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                    -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/
                '
              ;;

            debootstrap-chroot-qemu)
              echo "debootstrap-chroot-qemu: create sysroot via debootstrap (foreign) + qemu second-stage"
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends debootstrap qemu-user-static binfmt-support gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf rsync
              SYSROOT="/tmp/stretch-sysroot-${RUNNER_TEMP}"
              sudo rm -rf "${SYSROOT}"
              sudo mkdir -p "${SYSROOT}"
              # debootstrap foreign stage (use archive)
              sudo debootstrap --arch=armhf --foreign --variant=minbase stretch "${SYSROOT}" "http://archive.debian.org/debian"
              # copy qemu
              sudo cp /usr/bin/qemu-arm-static "${SYSROOT}/usr/bin/" || true
              # copy repo into sysroot so chroot has the source
              sudo rsync -a --exclude dist --exclude .git . "${SYSROOT}/src/"
              sudo mkdir -p "${SYSROOT}/etc/apt/apt.conf.d"
              echo 'Acquire::Check-Valid-Until "false";' | sudo tee "${SYSROOT}/etc/apt/apt.conf.d/99no-check-valid-until" >/dev/null
              printf '%s\n' "deb http://archive.debian.org/debian stretch main" "deb http://archive.debian.org/debian-security stretch/updates main" | sudo tee "${SYSROOT}/etc/apt/sources.list" >/dev/null
              sudo mount --bind /proc "${SYSROOT}/proc" || true
              sudo mount --bind /sys "${SYSROOT}/sys" || true
              sudo mount --bind /dev "${SYSROOT}/dev" || true
              sudo mount --bind /dev/pts "${SYSROOT}/dev/pts" || true

              # run second-stage and install dev pkgs inside chroot (use full path apt-get)
              sudo chroot "${SYSROOT}" /usr/bin/qemu-arm-static /bin/bash -c '
                set -euo pipefail
                export PATH=/usr/bin:/bin:/usr/sbin:/sbin
                rm -rf /var/lib/apt/lists/* || true
                /debootstrap/debootstrap --second-stage || true
                /usr/bin/apt-get -o Acquire::Check-Valid-Until=false update || true
                /usr/bin/apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends build-essential libc6-dev pkg-config ca-certificates golang-go || true
                rm -rf /var/lib/apt/lists/* || true
              '

              sudo umount -l "${SYSROOT}/proc" || true
              sudo umount -l "${SYSROOT}/sys" || true
              sudo umount -l "${SYSROOT}/dev/pts" || true
              sudo umount -l "${SYSROOT}/dev" || true
              sudo chmod -R a+rX "${SYSROOT}"

              # Build inside chroot (use chroot to ensure runtime libs and headers match)
              sudo chroot "${SYSROOT}" /usr/bin/qemu-arm-static /bin/bash -c '
                set -euo pipefail
                export PATH=/usr/bin:/bin:/usr/sbin:/sbin
                cd /src || (echo "No /src in chroot"; exit 2)
                export GOPATH=/go
                export PATH=/usr/local/go/bin:/usr/bin:$PATH || true
                CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 go build -buildvcs=false -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" -o /src/dist/linux-armv7/debootstrap-chroot-qemu/archive/cli-proxy-api ./cmd/server/ || true
              '

              ;;

            crosspkg-sysroot)
              echo "crosspkg-sysroot: install distro cross packages and build"
              sudo dpkg --add-architecture armhf || true
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                binutils-arm-linux-gnueabihf \
                libc6-armhf-cross \
                libc6-dev-armhf-cross \
                crossbuild-essential-armhf

              # Ensure sysroot layout: some packages install headers in .../usr/include
              SYSROOT="/usr/arm-linux-gnueabihf"
              if [[ -d "${SYSROOT}/usr/include" && ! -d "${SYSROOT}/include" ]]; then
                echo "Creating include symlink for SYSROOT" >&2
                sudo ln -s "${SYSROOT}/usr/include" "${SYSROOT}/include" || true
              fi
              if [[ -d "${SYSROOT}/usr/lib" && ! -d "${SYSROOT}/lib" ]]; then
                echo "Creating lib symlink for SYSROOT" >&2
                sudo ln -s "${SYSROOT}/usr/lib" "${SYSROOT}/lib" || true
              fi

              echo "ls -la ${SYSROOT} (diagnostic):" >&2
              ls -la "${SYSROOT}" || true
              ls -la "${SYSROOT}/usr/include" || true
              dpkg -L libc6-armhf-cross libc6-dev-armhf-cross || true

              if [[ ! -f "${SYSROOT}/lib/libc.so.6" && ! -f "${SYSROOT}/usr/lib/libc.so.6" ]]; then
                echo "Missing libc.so.6 in sysroot; aborting crosspkg" >&2
                ls -la "${SYSROOT}/lib" || true
                ls -la "${SYSROOT}/usr/lib" || true
                exit 2
              fi

              export CC="arm-linux-gnueabihf-gcc --sysroot=${SYSROOT}"
              export CXX="arm-linux-gnueabihf-g++ --sysroot=${SYSROOT}"
              export CGO_ENABLED=1
              export GOOS=linux
              export GOARCH=arm
              export GOARM=7
              export CGO_CFLAGS="--sysroot=${SYSROOT}"
              export CGO_LDFLAGS="--sysroot=${SYSROOT} -L${SYSROOT}/lib -L${SYSROOT}/usr/lib"

              CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
                go build -buildvcs=false -v -x -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "${archive_dir}/cli-proxy-api" ./cmd/server/
              ;;

            static-fallback)
              echo "static-fallback: CGO disabled build"
              CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
                go build -buildvcs=false -v -x -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "${archive_dir}/cli-proxy-api" ./cmd/server/
              ;;

            *)
              echo "unknown method ${METHOD}" >&2
              exit 1
              ;;
          esac

          # package artifact
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/" || true
          tar -C "$archive_dir" -czf "dist/${outname}" -C "$archive_dir" . || true

          BINPATH="${archive_dir}/cli-proxy-api"
          if [[ -f "${BINPATH}" ]]; then
            check_glibc_and_write "${BINPATH}" "${archive_dir}/build-readelf-${METHOD}.txt"
            if command -v readelf >/dev/null 2>&1; then
              max_glibc=$(sed -n 's/^max_glibc=//p' "${archive_dir}/build-readelf-${METHOD}.txt" | tr -d '\r\n' || true)
              if [[ -n "${max_glibc}" && "$(printf '%s\n' "2.24" "${max_glibc}" | sort -V | tail -n1)" != "2.24" ]]; then
                echo "Binary requires GLIBC_${max_glibc} which is > 2.24" | tee -a "${archive_dir}/build-readelf-${METHOD}.txt" >&2
                exit 2
              fi
            fi
          else
            echo "No binary produced by method ${METHOD}; check logs" >&2
            exit 3
          fi

      - name: Upload armv7 artifact (matrix)
        uses: actions/upload-artifact@v4
        with:
          name: armv7-${{ matrix.method }}
          path: dist/linux-armv7/${{ matrix.method }}/*
          if-no-files-found: warn

################################################################################
# Native arm runner: direct build + debootstrap-native (most reliable for runtime)
################################################################################
  build-armv7-native:
    name: build armv7 (native runner)
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Metadata
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl golang-go
      - name: Build native (CGO enabled)
        run: |
          set -euo pipefail
          mkdir -p dist/linux-armv7/native/archive
          CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
            go build -buildvcs=false -v -x -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o dist/linux-armv7/native/archive/cli-proxy-api ./cmd/server/
          cp LICENSE README.md README_CN.md config.example.yaml dist/linux-armv7/native/archive/ || true
          tar -C dist/linux-armv7/native/archive -czf dist/CLIProxyAPI_${RELEASE_VERSION}_linux_armv7_native.tar.gz .
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: armv7-native
          path: dist/linux-armv7/native/*
          if-no-files-found: error

  build-armv7-debootstrap-native:
    name: debootstrap (native arm runner)
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install debootstrap & deps (native)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap build-essential ca-certificates golang-go rsync
      - name: Create stretch sysroot & build inside chroot (native)
        run: |
          set -euo pipefail
          SYSROOT="/tmp/stretch-sysroot-native"
          sudo rm -rf "${SYSROOT}"
          sudo mkdir -p "${SYSROOT}"
          sudo debootstrap --arch=armhf --variant=minbase stretch "${SYSROOT}" "http://archive.debian.org/debian"
          # copy repo into sysroot so /src exists inside chroot
          sudo rsync -a --exclude dist --exclude .git . "${SYSROOT}/src/"
          sudo mkdir -p "${SYSROOT}/etc/apt/apt.conf.d"
          echo 'Acquire::Check-Valid-Until "false";' | sudo tee "${SYSROOT}/etc/apt/apt.conf.d/99no-check-valid-until" >/dev/null
          printf '%s\n' "deb http://archive.debian.org/debian stretch main" "deb http://archive.debian.org/debian-security stretch/updates main" | sudo tee "${SYSROOT}/etc/apt/sources.list" >/dev/null
          sudo mount --bind /proc "${SYSROOT}/proc" || true
          sudo mount --bind /sys "${SYSROOT}/sys" || true
          sudo mount --bind /dev "${SYSROOT}/dev" || true
          sudo chroot "${SYSROOT}" /bin/bash -c '
            set -euo pipefail
            export PATH=/usr/bin:/bin:/usr/sbin:/sbin
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends build-essential libc6-dev golang-go pkg-config ca-certificates
            rm -rf /var/lib/apt/lists/*
          '
          sudo umount -l "${SYSROOT}/proc" || true
          sudo umount -l "${SYSROOT}/sys" || true
          sudo umount -l "${SYSROOT}/dev" || true
          sudo chmod -R a+rX "${SYSROOT}"
          # Build inside chroot (use system go installed in chroot)
          sudo chroot "${SYSROOT}" /bin/bash -c '
            set -euo pipefail
            export PATH=/usr/bin:/bin:/usr/sbin:/sbin
            cd /src || (echo "No /src in chroot"; exit 2)
            export GOPATH=/go
            export PATH=/usr/local/go/bin:/usr/bin:$PATH || true
            CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 go build -buildvcs=false -v -x -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" -o /src/dist/linux-armv7/debootstrap-native/archive/cli-proxy-api ./cmd/server/ || true
          '
      - name: Upload debootstrap-native artifact
        uses: actions/upload-artifact@v4
        with:
          name: armv7-debootstrap-native
          path: dist/linux-armv7/debootstrap-native/*
          if-no-files-found: warn

################################################################################
# Publish checksums
################################################################################
  publish-checksums:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-linux-glibc
      - build-armv7-parallel
      - build-armv7-native
      - build-armv7-debootstrap-native
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist || exit 0
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber || true
